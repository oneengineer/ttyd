name: ttyd binaries and release

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    tags: ['[0-9]*.[0-9]*.[0-9]*']
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: ttyd-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl file libtool python3 qemu-user
      - name: Build static binary
        env:
          BUILD_TARGET: ${{ matrix.arch }}
          CROSS_ROOT: ${{ runner.temp }}/ttyd-cross
          STAGE_ROOT: ${{ runner.temp }}/ttyd-stage
          BUILD_ROOT: ${{ runner.temp }}/ttyd-dependencies
        run: |
          source scripts/release/dependencies.env
          ./scripts/cross-build.sh
          mkdir -p dist
          install -m 755 build/ttyd "dist/ttyd.linux-$BUILD_TARGET"
      - name: Verify binary and authentication
        env:
          TTYD_ARCH: ${{ matrix.arch }}
        run: |
          binary="dist/ttyd.linux-$TTYD_ARCH"
          file "$binary"
          if readelf -d "$binary" | grep -q '(NEEDED)'; then
            echo 'Unexpected dynamic dependency in Linux binary' >&2
            exit 1
          fi
          if [ "$TTYD_ARCH" = x86_64 ]; then
            "$binary" --version
            python3 scripts/release/test-auth.py "$binary"
          else
            qemu-aarch64 "$binary" --version
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd.linux-${{ matrix.arch }}
          path: dist/ttyd.linux-${{ matrix.arch }}
          if-no-files-found: error

  macos:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build binary with static third-party libraries
        run: bash scripts/release/build-macos.sh
      - name: Test real HTTP, WebSocket and PTY authentication
        run: python3 scripts/release/test-auth.py dist/ttyd.macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd.macos-arm64
          path: |
            dist/ttyd.macos-arm64
            dist/THIRD_PARTY_LICENSES.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/validate-tag.py "$RELEASE_TAG"
      - uses: actions/download-artifact@v8
        with:
          pattern: ttyd.*
          merge-multiple: true
          path: dist
      - name: Check release assets and generate SHA256SUMS
        run: |
          test -s dist/ttyd.linux-x86_64
          test -s dist/ttyd.linux-aarch64
          test -s dist/ttyd.macos-arm64
          test -s dist/THIRD_PARTY_LICENSES.tar.gz
          cd dist
          sha256sum ttyd.* THIRD_PARTY_LICENSES.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release/release-notes.py "$RELEASE_TAG" > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
              --title "ttyd $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "ttyd $RELEASE_TAG" --notes-file release-notes.md
